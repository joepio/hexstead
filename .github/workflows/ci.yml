name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gamenight-sdk:
    uses: ontola/gamenight/.github/workflows/godot-sdk-check.yml@main
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Godot and the Windows export templates
        uses: ontola/gamenight/.github/actions/setup-godot@main
        with:
          version: 4.5.2
          export-templates: windows_release_x86_64.exe windows_release_x86_64_console.exe
      - name: Import
        run: $GODOT --headless --import || true
      - name: Rule tests (60 boards, 25 bot games)
        run: $GODOT --headless --script tests/rules_test.gd
      - name: GameNight lifecycle and phone screens
        run: python tests/lifecycle.py --godot "$GODOT"
      - name: Export Windows build
        run: |
          mkdir -p build/windows
          "$GODOT" --headless --export-release "Windows" build/windows/Hexstead.exe
          "$GODOT" --headless --export-pack "Windows" build/hexstead.pck
      - name: The exported game serves its phone page
        run: python tests/lifecycle.py --godot "$GODOT" --pack build/hexstead.pck
      - name: Package
        run: |
          cd build/windows
          zip -q -9 hexstead-windows.zip Hexstead*.exe
          sha256sum hexstead-windows.zip > release-sha256.txt
          cat release-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: hexstead-windows
          path: |
            build/windows/hexstead-windows.zip
            build/windows/release-sha256.txt
          if-no-files-found: error
